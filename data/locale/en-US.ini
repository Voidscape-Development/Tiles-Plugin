Tiles.Easing.Linear="Linear"
Tiles.Easing.InOut="Ease In and Out"
Tiles.Easing.Out="Ease Out"

Tiles.Invert="Invert mask (outgoing scene inside the tiles)"
Tiles.ReverseExit="Tiles leave in reverse order"
Tiles.BTiles="Incoming scene arrives as tiles"
Tiles.BTiles.Description="The incoming scene grows back in tile by tile instead of sitting behind the transition. The gap between the outgoing and incoming tiles shows the tile colour."

Vortex.Transition="Vortex Transition"

Vortex.Arms="Spiral Arms"
Vortex.Arms.Description="How many arms the spiral has. Low counts read as a few broad sweeps, high counts as fine filaments."

Vortex.Twist="Twist"
Vortex.Twist.Description="How tightly the arms wind in towards the centre. 0 makes them straight spokes."

Vortex.Spin="Spin"
Vortex.Spin.Description="Turns the vortex makes over the whole transition. Negative values spin the other way. The spin is driven by the transition clock, not by wall time, so it looks the same every play whatever duration OBS is set to."

Vortex.Detail="Detail"

Vortex.Roughness="Edge Roughness"
Vortex.Roughness.Description="How far the opening portal's rim is chewed up. 0 gives a clean circle."

Vortex.Intensity="Intensity"

Vortex.ColorCore="Core Colour"

Vortex.CoreBleed="Core Bleed"
Vortex.CoreBleed.Description="How far the core colour spreads into the vortex when it flashes. Low keeps it to the hottest points, high lets it flood the arms. 50% is the original look."

Vortex.CoreBlend="Core Blend"
Vortex.CoreBlend.Description="How abruptly the vortex colour gives way to the core colour. Low is a hard edge between the two, high is a wide fade. 50% is the original look."

Vortex.ColorBody="Vortex Colour"

Vortex.ColorCount="Vortex Colours"
Vortex.ColorCount.Description="How many colours the body of the vortex mixes between. 1 is a single flat colour."

Vortex.ColorMix="Colour Mix"
Vortex.ColorMix.Description="How the colours are spread through the vortex."
Vortex.ColorMix.Arms="Along the arms"
Vortex.ColorMix.Radial="Centre to edge"
Vortex.ColorMix.Bands="Banded arms"

Vortex.ColorBody2="Vortex Colour 2"
Vortex.ColorBody3="Vortex Colour 3"
Vortex.ColorBody4="Vortex Colour 4"

Vortex.OriginX="Centre X"
Vortex.OriginY="Centre Y"

Vortex.OpenEnd="Portal Open"
Vortex.OpenEnd.Description="How much of the transition the portal spends growing to fill the canvas. The scenes are swapped after this, while the vortex is opaque."

Vortex.RevealStart="Reveal Start"
Vortex.RevealStart.Description="When the incoming scene starts coming back through the smoke. Held above Portal Open so the vortex always closes over the canvas before the scenes swap."

Vortex.SmokeScale="Smoke Scale"
Vortex.SmokeSoftness="Smoke Softness"

Vortex.Swirl="Swirl the scenes into the vortex"
Vortex.Swirl.Description="Screws the outgoing scene down into the centre and unwinds the incoming one back out of it, instead of leaving both flat behind the vortex. The first and last frame of the transition are untouched either way."
Vortex.SwirlAmount="Swirl Amount"

Glass.Transition="Glass Transition"

Glass.Preset="Preset"
Glass.Preset.Description="A complete look in one pick: the preset sets the break style, the crack pattern, the timing, the motion and the glass finish together. Change any of them afterwards and this goes back to Custom."
Glass.Preset.Custom="Custom"
Glass.Preset.Window="Window Break"
Glass.Preset.Explosion="Explosion"
Glass.Preset.Gentle="Gentle Fall"
Glass.Preset.Freeze="Freeze"

Glass.Style="Break Style"
Glass.Style.Description="What the shards do once the pane has cracked."
Glass.Style.Window="Window Break (shards fall away)"
Glass.Style.Blow="Blow Outward (shards fly past the camera)"
Glass.Style.Wipe="Crack Wipe (nothing moves)"
Glass.Style.Assemble="Shatter Out, Assemble In"

Glass.Pattern="Crack Pattern"
Glass.Pattern.Description="How the pane is broken up. Spiderweb radiates from the impact with the shards growing larger further out, the way a struck pane cracks. Voronoi is irregular angular cells with no focal point. Cracked Ice cuts the canvas with straight splits, giving a wide spread of shard sizes and the odd long splinter."
Glass.Pattern.Web="Spiderweb"
Glass.Pattern.Voronoi="Voronoi"
Glass.Pattern.Ice="Cracked Ice"

Glass.ShardSize="Shard Size"
Glass.ShardSize.Description="Shard size in pixels at your canvas resolution. There is a ceiling on the number of shards, so on a large canvas a very small size stops getting smaller rather than building a mesh too big to draw."

Glass.Seed="Break Seed"
Glass.Seed.Description="Changes which break you get without changing anything about how it looks. The same seed always gives the same break, so a transition plays the same way every time."

Glass.ImpactX="Impact Centre X"
Glass.ImpactY="Impact Centre Y"

Glass.CrackSpread="Crack Spread"
Glass.CrackSpread.Description="How much of the transition the cracks spend racing out from the impact. The break is sized to the furthest corner, so the whole pane is cracked by the end of it wherever the impact is."

Glass.Hold="Hold"
Glass.Hold.Description="How long the cracked pane holds still before the shards let go, as a share of the transition. Held above zero so the break is always readable before it comes apart."

Glass.Easing="Crack Easing"
Glass.Easing.Description="Shapes the order the shards crack in, not the transition clock, so the crack front can accelerate away and settle while the shards themselves still fall at a steady rate."
Glass.Easing.Linear="Linear"
Glass.Easing.InOut="Ease In and Out"
Glass.Easing.Out="Ease Out"

Glass.GravityAngle="Gravity Direction"
Glass.GravityAngle.Description="Which way the shards fall. 0° pulls to the right, 90° straight down."
Glass.Gravity="Gravity"

Glass.Throw="Throw"
Glass.Throw.Description="How hard the shards are pushed away from the impact as they let go. Gravity takes over from there."

Glass.Spin="Spin"
Glass.Spin.Description="Turns a shard makes over its whole flight. Each one takes its own axis and direction, so they tumble rather than rotating together."

Glass.Scatter="Scatter"
Glass.Scatter.Description="Blends the ordered break towards a shuffle: shards stop letting go in step with the crack front and stop flying straight out along their own radius."

Glass.Flat="Flat shards (no 3D tumble)"
Glass.Flat.Description="Keeps the shards in the screen plane, turning in it rather than tumbling through it. Cleaner and more graphic; it also means the shards no longer have to be sorted by depth each frame."

Glass.CrackColor="Crack Colour"
Glass.CrackColor.Description="Lights the cracks, the bevel along each shard's cut edge, and the glint sweeping across the pane."

Glass.CrackWidth="Crack Width"
Glass.CrackGlow="Crack Glow"
Glass.CrackGlow.Description="How hard a crack burns at the moment it forms. The flash travels with the crack front rather than lighting the whole break at once."

Glass.Rim="Edge Light"
Glass.Rim.Description="Brightness of the lit bevel along every cut edge, which is what gives the shards thickness. A shard caught at a glancing angle picks up more of it, the way a real one does as it turns over."
Glass.RimWidth="Edge Light Width"

Glass.Refract="Refraction"
Glass.Refract.Description="How far the scene is bent near a shard's edges, as though seen through a thick broken pane. Measured in pixels at the very edge, falling to nothing in the middle of the shard."

Glass.Tint="Shard Variation"
Glass.Tint.Description="Randomly lightens and darkens each shard, so the break reads as many pieces of glass rather than one image cut up."

Glass.Glint="Glint"
Glass.Glint.Description="A highlight sweeping across the pane as it breaks. It tracks where each shard started rather than where it has flown to, so it reads as one light crossing a sheet of glass."
