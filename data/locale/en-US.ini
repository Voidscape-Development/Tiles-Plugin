Tiles.TileDuration="Per-Tile Duration"
Tiles.TileDuration.Description="How long a single tile's own animation lasts, as a share of the whole transition. Low values give a sharp travelling edge, 100% animates every tile at once. This is not the length of the transition itself, which OBS sets."

Tiles.Randomness="Order Randomness"

